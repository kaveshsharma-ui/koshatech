<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 320 60"
  role="img"
  aria-labelledby="title desc"
>
  <title id="title">Koshatech logo</title>
  <desc id="desc">
    Bold KOSHATECH wordmark set in a clean, modern style.
  </desc>

  <defs>
    <style>
      text {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
    </style>
  </defs>

  <!-- Primary wordmark -->
  <g fill="#020617">
    <text
      x="8"
      y="42"
      font-size="40"
      font-weight="800"
      letter-spacing="0.14em"
    >
      KOSHATECH
    </text>
  </g>
</svg>

